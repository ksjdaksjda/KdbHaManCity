<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文智能写作助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--pri:#1a5276;--acc:#2e86c1;--suc:#27ae60;--war:#f39c12;--err:#e74c3c;--bg:#f0f3f7;--card:#fff;--txt:#2c3e50;--bor:#dce1e8;--sw:220px}
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 'Microsoft YaHei','PingFang SC',sans-serif;color:var(--txt);display:flex;min-height:100vh;background:linear-gradient(rgba(245,247,250,.85),rgba(245,247,250,.88)),url('bg.jpg') center/cover fixed}
#login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#1a3c54,#1a5276,#2e86c1);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#login-overlay.hidden{display:none}
.login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;width:380px}
.login-box h1{color:var(--pri);margin-bottom:4px;font-size:22px}
.login-box .sub{color:#888;margin-bottom:16px;font-size:13px}
.login-box input{width:100%;padding:12px;border:2px solid var(--bor);border-radius:8px;font-size:15px;text-align:center;margin:8px 0;outline:none}
.login-box input:focus{border-color:var(--acc)}
.login-box button{width:100%;padding:12px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:bold;transition:.2s}
.login-box button:hover{background:#2471a3}.login-box .err{color:var(--err);margin-top:8px;font-size:13px;min-height:20px}
#sidebar{width:var(--sw);background:linear-gradient(180deg,#1a3c54,#1a5276);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;display:flex;flex-direction:column}
#sidebar .logo{padding:14px 16px;font-size:16px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.1);text-align:center}
#sidebar .net{padding:6px 16px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05)}
#sidebar .nav-item{padding:9px 16px;cursor:pointer;font-size:13px;border-left:3px solid transparent;transition:.15s;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px;user-select:none}
#sidebar .nav-item:hover{background:rgba(255,255,255,.06);border-left-color:var(--acc)}
#sidebar .nav-item.active{background:rgba(255,255,255,.1);border-left-color:var(--acc);font-weight:bold;color:#fff}
#sidebar .bottom{margin-top:auto;padding:10px;font-size:11px;text-align:center;opacity:.5}
#main{margin-left:var(--sw);flex:1;padding:20px 28px;max-width:1100px}
.page{display:none}.page.active{display:block}
.card{background:rgba(255,255,255,.92);border-radius:10px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow-x:auto}
.card h2,.card h3{color:var(--pri);margin-bottom:10px}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:5px;transition:.15s;font-family:inherit;font-weight:500}
.btn:hover{opacity:.88;transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn-primary{background:var(--acc);color:#fff}.btn-success{background:var(--suc);color:#fff}.btn-danger{background:var(--err);color:#fff}.btn-warning{background:var(--war);color:#fff}.btn-outline{background:#fff;color:var(--acc);border:1px solid var(--acc)}.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--bor);border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(46,134,193,.1)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:3px;font-weight:500;color:#555;font-size:13px}
.fg{margin-bottom:10px}.fr{display:flex;gap:10px}.fr>*{flex:1}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.type-card{padding:14px;border:2px solid var(--bor);border-radius:10px;cursor:pointer;text-align:center;transition:.15s;background:#fff}
.type-card:hover{border-color:var(--acc);background:#ebf5fb}
.type-card.sel{border-color:var(--acc);background:#d6eaf8}.type-card .n{font-weight:bold;font-size:14px}.type-card .w{font-size:11px;color:#888}
.progress-bar{height:6px;background:var(--bor);border-radius:3px;margin:6px 0;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--suc));border-radius:3px;transition:.4s}
.writing-content{background:#fafafa;border:1px solid var(--bor);border-radius:8px;padding:18px;min-height:200px;max-height:65vh;overflow-y:auto;white-space:pre-wrap;line-height:1.8;font-size:14px}
.fb-item{border-left:3px solid var(--war);padding:6px 10px;margin:4px 0;background:#fef9e7;border-radius:0 6px 6px 0;font-size:12px}.fb-item.done{border-left-color:var(--suc);background:#eafaf1}
.toast{position:fixed;top:16px;right:16px;padding:10px 20px;border-radius:8px;color:#fff;z-index:9999;animation:si .25s;font-size:13px}
.toast.success{background:var(--suc)}.toast.error{background:var(--err)}.toast.info{background:var(--acc)}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat{text-align:center;padding:8px 16px;background:rgba(248,249,250,.8);border-radius:8px}.stat .v{font-size:20px;font-weight:bold;color:var(--acc)}.stat .l{font-size:11px;color:#888}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th,.data-table td{padding:4px 8px;border:1px solid var(--bor);text-align:left}
.data-table th{background:#f0f5fa;font-weight:bold}.data-table tr:hover{background:#f8f9fa}
.tab-nav{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--bor)}
.tab-nav span{padding:6px 14px;cursor:pointer;border-radius:6px 6px 0 0;font-size:13px;transition:.15s}
.tab-nav span:hover{background:#e8f0fe}.tab-nav span.active{background:var(--acc);color:#fff}
.upload-zone{border:2px dashed var(--bor);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:.2s;background:rgba(250,250,250,.6)}
.upload-zone:hover{border-color:var(--acc);background:#ebf5fb}
canvas{max-width:100%;margin:8px 0}
@media(max-width:768px){#sidebar{width:54px}#sidebar .nav-item span,#sidebar .logo{display:none}#main{margin-left:54px;padding:10px}.type-grid{grid-template-columns:repeat(2,1fr)}.fr{flex-direction:column}}
</style>
</head>
<body>

<div id="login-overlay">
  <div style="color:rgba(255,255,255,.8);font-size:48px;margin-bottom:16px;">📝</div>
  <div class="login-box">
    <h1>论文智能写作助手</h1><p class="sub">基于 DeepSeek AI | 支持Excel数据导入 | 公式自动识别</p>
    <input type="password" id="login-pwd" placeholder="输入访问密码" onkeydown="if(event.key==='Enter')doLogin()" autofocus>
    <button onclick="doLogin()">登 录</button><p id="login-err" class="err"></p>
  </div>
</div>

<div id="sidebar">
  <div class="logo">📝 论文助手</div><div class="net" id="net-status">检测网络中...</div>
  <div id="sidebar-nav"></div><div class="bottom">v7.0 | 15模板<br>每台设备独立</div>
</div>
<div id="main"></div>

<script>
// ==================== 全局状态 ====================
const PWD='2004622',DS_URL='https://api.deepseek.com/v1',DS_MODEL='deepseek-chat',STORAGE_KEY='tw_data';
let S={page:'home',thesisType:'chinese_bachelor',apiKey:'',apiValidated:false,networkOk:false,metadata:{title:'',title_en:'',author:'',advisor:'',university:'',department:'',student_id:'',degree:'本科'},outline:[],userData:'',referenceLinks:'',references:[],formulas:[],feedbacks:[],currentSectionIdx:0,deaiCfg:{pass1:true,pass2:true,pass3:false,pass4:true,pass5:false},uploadedFiles:[],dataTables:{},dataCharts:{},uploadedImages:[],selectedDataTab:'text'};
let _id=n=>document.getElementById(n),_esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const THESIS_TYPES={chinese_bachelor:{name:'本科毕业论文',words:15000},chinese_master:{name:'硕士毕业论文',words:30000},chinese_doctor:{name:'博士毕业论文',words:50000},journal_paper:{name:'期刊论文',words:8000},course_paper:{name:'课程论文',words:5000},research_report:{name:'研究报告',words:10000},literature_review:{name:'文献综述',words:8000},proposal:{name:'开题报告',words:5000},midterm:{name:'中期报告',words:4000},experiment:{name:'实验报告',words:6000},case_study:{name:'案例分析',words:8000},survey:{name:'调研报告',words:10000},design_doc:{name:'毕业设计说明书',words:12000},grant:{name:'课题申报书',words:6000},ppt_outline:{name:'学术PPT大纲',words:3000}};
const NAV=[{id:'home',icon:'🏠',label:'首页'},{id:'metadata',icon:'📋',label:'论文信息'},{id:'apikey',icon:'🔑',label:'API密钥'},{id:'outline',icon:'📑',label:'大纲'},{id:'data',icon:'📊',label:'数据输入'},{id:'writing',icon:'✍️',label:'逐节写作'},{id:'formulas',icon:'📐',label:'公式管理'},{id:'references',icon:'📚',label:'参考文献'},{id:'feedback',icon:'💬',label:'意见反馈'},{id:'deai',icon:'🔄',label:'去AI化'},{id:'revise',icon:'📝',label:'论文修改'},{id:'export',icon:'📥',label:'导出'}];

function toast(m,t='info'){let e=document.createElement('div');e.className='toast '+t;e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S))}catch(e){toast('存储空间不足，请清理旧数据','error')}}
function saveProject(name){let saves=JSON.parse(localStorage.getItem('tw_saves')||'{}');saves[name]={data:S,time:new Date().toISOString()};localStorage.setItem('tw_saves',JSON.stringify(saves));toast('✅ 存档已保存: '+name,'success')}
function loadProject(name){let saves=JSON.parse(localStorage.getItem('tw_saves')||'{}');if(saves[name]){let d=saves[name].data;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d);save();toast('✅ 已加载: '+name,'success');return true}return false}
function deleteProject(name){let saves=JSON.parse(localStorage.getItem('tw_saves')||'{}');delete saves[name];localStorage.setItem('tw_saves',JSON.stringify(saves));toast('已删除: '+name,'info');renderPage('home')}
function listSaves(){return JSON.parse(localStorage.getItem('tw_saves')||'{}')}
function exportSave(){let blob=new Blob([JSON.stringify({data:S,saves:listSaves()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='论文进度备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('✅ 进度文件已下载','success')}
function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=function(e){let reader=new FileReader();reader.onload=function(ev){try{let d=JSON.parse(ev.target.result);if(d.data){Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,d.data);save();toast('✅ 进度已恢复','success');renderPage('home')}if(d.saves){localStorage.setItem('tw_saves',JSON.stringify(d.saves));toast('✅ 存档已恢复','success')}}catch(ex){toast('文件格式错误','error')}};reader.readAsText(e.target.files[0])};input.click()}
function load(){let s=localStorage.getItem(STORAGE_KEY);if(s)try{let d=JSON.parse(s);Object.assign(S,d)}catch(e){}}
function ft(url,opts={},ms=5000){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t))}

// ==================== 登录 ====================
function doLogin(){if(_id('login-pwd').value===PWD){_id('login-overlay').classList.add('hidden');load();checkNet();renderSidebar();navigate(S.page||'home')}else{_id('login-err').textContent='密码错误'}}
async function checkNet(){try{await ft(DS_URL+'/models',{headers:{'Authorization':'Bearer '+(S.apiKey||'test')}},4000);S.networkOk=true}catch(e){try{await ft('https://www.baidu.com',{},3000);S.networkOk=false}catch(e2){S.networkOk=false}}let e=_id('net-status');if(S.networkOk){e.innerHTML='🟢 AI可用';e.style.color='#2ecc71'}else{e.innerHTML='🔴 AI不可用';e.style.color='#e74c3c'}}

// ==================== 导航 ====================
function renderSidebar(){_id('sidebar-nav').innerHTML=NAV.map(n=>`<div class="nav-item${S.page===n.id?' active':''}" onclick="navigate('${n.id}')">${n.icon} <span>${n.label}</span></div>`).join('')}
function navigate(p){S.page=p;save();renderSidebar();document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));let el=_id(p);if(el)el.classList.add('active');renderPage(p)}
function renderPage(p){let m=_id('main'),f=window['render'+p.charAt(0).toUpperCase()+p.slice(1)];m.innerHTML=`<div class="page active" id="${p}"></div>`;if(f)f(_id(p))}

// ==================== DeepSeek API ====================
async function dsCall(sys,usr,stream=false){if(!S.apiKey)throw new Error('请先设置API密钥');let r=await fetch(DS_URL+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},body:JSON.stringify({model:DS_MODEL,messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.7,max_tokens:8192,stream})});if(!r.ok){let e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${r.status}`)}return r}
async function*dsStream(sys,usr){let r=await dsCall(sys,usr,true),reader=r.body.getReader(),dec=new TextDecoder(),buf='';while(1){let{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';for(let l of lines){if(l.startsWith('data: ')){let d=l.slice(6).trim();if(d==='[DONE]')return;try{let c=JSON.parse(d).choices?.[0]?.delta?.content;if(c)yield c}catch(e){}}}}}

// ==================== 首页 ====================
function renderHome(el){let ks=Object.keys(THESIS_TYPES),saves=listSaves(),saveNames=Object.keys(saves);el.innerHTML=`<h2>📝 论文智能写作助手</h2><p style="color:#888;margin-bottom:14px;">DeepSeek AI | Excel分析 | 公式识别 | 图表生成 | 进度存档</p><div class="card"><h3>🎓 选择文章类型</h3><div class="type-grid">${ks.map(k=>`<div class="type-card${S.thesisType===k?' sel':''}" onclick="S.thesisType='${k}';save();renderPage('home')"><div class="n">${THESIS_TYPES[k].name}</div><div class="w">${THESIS_TYPES[k].words.toLocaleString()} 字</div></div>`).join('')}</div><button class="btn btn-primary" style="margin-top:14px;font-size:14px;padding:10px 24px;" onclick="navigate('metadata')">🚀 开始写作</button></div><div class="card"><h3>💾 进度存档</h3><div class="fr"><input id="save-name" placeholder="存档名称，如：我的毕设2024"><button class="btn btn-primary" onclick="saveProject(_id('save-name').value||'存档_'+new Date().toISOString().slice(0,10));renderPage('home')">💾 保存当前进度</button></div>${saveNames.length>0?`<div style="margin-top:10px;"><h4>已保存的存档 (${saveNames.length}个)</h4>${saveNames.map(n=>{let s=saves[n];return`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0;"><span>📁 <b>${_esc(n)}</b> <span style="color:#888;font-size:11px;">${(s.time||'').slice(0,16)}</span></span><span><button class="btn btn-sm btn-outline" onclick="loadProject('${n}');renderPage('home')">📂 加载</button><button class="btn btn-sm btn-danger" onclick="deleteProject('${n}')">删除</button></span></div>`}).join('')}</div>`:''}<div style="margin-top:8px;display:flex;gap:8px;"><button class="btn btn-sm btn-outline" onclick="exportSave()">📥 导出进度文件(.json)</button><button class="btn btn-sm btn-outline" onclick="importSave()">📤 导入进度文件</button></div></div>`}

// ==================== 论文信息 ====================
function renderMetadata(el){let m=S.metadata,t=THESIS_TYPES[S.thesisType];el.innerHTML=`<h2>📋 论文基本信息</h2><div class="card"><p>类型: <b>${t.name}</b> | 目标: <b>${t.words.toLocaleString()}</b> 字</p></div><div class="card"><h3>填写信息</h3><div class="fr"><div class="fg"><label>论文标题 *</label><input id="m-title" value="${_esc(m.title)}" placeholder="输入研究题目"></div><div class="fg"><label>英文标题</label><input id="m-title_en" value="${_esc(m.title_en)}" placeholder="可选"></div></div><div class="fr"><div class="fg"><label>作者姓名 *</label><input id="m-author" value="${_esc(m.author)}"></div><div class="fg"><label>指导教师 *</label><input id="m-advisor" value="${_esc(m.advisor)}"></div></div><div class="fr"><div class="fg"><label>学校 *</label><input id="m-university" value="${_esc(m.university)}"></div><div class="fg"><label>院系/专业</label><input id="m-department" value="${_esc(m.department)}"></div></div><div class="fr"><div class="fg"><label>学号</label><input id="m-student_id" value="${_esc(m.student_id)}"></div><div class="fg"><label>学位</label><select id="m-degree">${['本科','硕士','博士'].map(d=>`<option ${m.degree===d?'selected':''}>${d}</option>`).join('')}</select></div></div><button class="btn btn-primary" onclick="saveMeta()">💾 保存并继续</button></div>${m.title?`<div class="card"><h3>📄 当前信息</h3><table style="width:100%;font-size:13px;"><tr><td style="color:#888;width:80px;">标题</td><td>${_esc(m.title)}</td></tr><tr><td style="color:#888;">作者</td><td>${_esc(m.author)}</td></tr><tr><td style="color:#888;">导师</td><td>${_esc(m.advisor)}</td></tr><tr><td style="color:#888;">学校</td><td>${_esc(m.university)}</td></tr><tr><td style="color:#888;">学位</td><td>${_esc(m.degree)}</td></tr></table></div>`:''}`}
function saveMeta(){['title','title_en','author','advisor','university','department','student_id','degree'].forEach(k=>S.metadata[k]=_id('m-'+k).value);if(!S.metadata.title||!S.metadata.author||!S.metadata.advisor||!S.metadata.university){toast('请填写标题、作者、导师、学校','error');return}save();toast('✅ 信息已保存','success')}

// ==================== API密钥 ====================
function renderApikey(el){el.innerHTML=`<h2>🔑 DeepSeek API 密钥</h2><div class="card">${S.apiKey?`<p style="color:green;">✅ 已设置: <code>${S.apiKey.slice(0,10)}...${S.apiKey.slice(-4)}</code></p><button class="btn btn-outline btn-sm" onclick="testKey()">🔄 验证</button><button class="btn btn-danger btn-sm" onclick="S.apiKey='';S.apiValidated=false;save();renderPage('apikey')">🗑️ 删除</button>`:'<p style="color:orange;">⚠️ 未设置密钥</p>'}<hr style="margin:10px 0"><p style="font-size:12px;color:#888;">获取: <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> | 浏览器本地存储</p><div class="fr" style="margin-top:8px;"><input id="api-input" type="password" placeholder="sk-xxxxxxxx" style="flex:3"><button class="btn btn-primary" onclick="saveKey()" style="flex:1">✅ 验证并保存</button></div></div>`}
async function saveKey(){let k=_id('api-input').value;if(!k)return toast('请输入密钥','error');try{let r=await fetch(DS_URL+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:DS_MODEL,messages:[{role:'user',content:'Hi'}],max_tokens:1})});if(r.ok||r.status===400){S.apiKey=k;S.apiValidated=true;save();toast('🎉 验证成功','success');renderPage('apikey')}else{let e=await r.json().catch(()=>({}));toast('无效: '+(e.error?.message||r.status),'error')}}catch(e){toast('失败: '+e.message,'error')}}
async function testKey(){try{await dsCall('','Hi');S.apiValidated=true;toast('✅ 有效','success')}catch(e){S.apiValidated=false;toast('❌ 无效','error')}}

// ==================== 数据输入（增强版） ====================
function renderData(el){
  let tabs=['text','table','chart','image'],names=['📝 文字描述','📊 上传Excel/CSV','📈 数据图表','🖼️ 图片上传'];
  let active=S.selectedDataTab||'text';
  el.innerHTML=`<h2>📊 研究数据输入</h2><div class="tab-nav">${tabs.map((t,i)=>`<span class="${active===t?'active':''}" onclick="S.selectedDataTab='${t}';save();renderPage('data')">${names[i]}</span>`).join('')}</div>`;

  if(active==='text'){

function handleFile(evt){
  let files=evt.target.files;if(!files||files.length===0)return;
  for(let f of files)parseFile(f);evt.target.value='';
}
function handleDrop(evt){
  evt.preventDefault();evt.currentTarget.style.borderColor='';
  let files=evt.dataTransfer.files;if(!files||files.length===0)return;
  for(let f of files)parseFile(f);return false;
}
function parseFile(file){
  let name=file.name,ext=name.split('.').pop().toLowerCase();
  if(!['xlsx','xls','csv'].includes(ext)){toast(name+' 仅支持 .xlsx .xls .csv','error');return}
  toast('正在解析 '+name+'...','info');
  let reader=new FileReader();
  reader.onload=function(e){
    try{
      let wb,data;
      if(ext==='csv'){
        let text=new TextDecoder().decode(e.target.result);
        data=text.split('\n').filter(l=>l.trim()).map(l=>l.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
      }else{
        wb=XLSX.read(e.target.result,{type:'array'});let sn=wb.SheetNames[0];
        data=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1});
      }
      if(!data||data.length===0){toast(name+' 为空','error');return}
      let headers=(data[0]||[]).map((h,i)=>h!==undefined&&h!==null&&h!==''?String(h):'列'+(i+1));
      let rows=data.slice(1).filter(r=>r&&r.some(c=>c!==undefined&&c!==null&&c!==''));
      let key=name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9一-鿿_-]/g,'_');
      S.dataTables[key]={headers:headers,rows:rows,name:name};
      S.uploadedFiles=S.uploadedFiles.filter(f=>f.key!==key);
      S.uploadedFiles.push({name:name,rows:rows.length,cols:headers.length,key:key});
      save();toast(`✅ ${name} (${rows.length}行×${headers.length}列)`,'success');renderFileList();
    }catch(ex){toast(name+' 解析失败: '+ex.message,'error')}
  };
  if(ext==='csv')reader.readAsArrayBuffer(file);else reader.readAsArrayBuffer(file);
}
function renderFileList(){
  let el=_id('file-list');if(!el)return;
  if(S.uploadedFiles.length===0){el.innerHTML='<p style="color:#888;margin-top:8px;">暂无上传文件</p>';return}
  el.innerHTML=S.uploadedFiles.map((f,i)=>`<div class="card" style="padding:12px;margin:8px 0;"><div style="display:flex;justify-content:space-between;align-items:center;"><b>📎 ${_esc(f.name)}</b> <span style="color:#888;font-size:12px;">${f.rows}行×${f.cols}列</span></div><div style="max-height:300px;overflow:auto;margin-top:8px;"><table class="data-table"><thead><tr>${(S.dataTables[f.key]?.headers||[]).map(h=>`<th>${_esc(String(h||''))}</th>`).join('')}</tr></thead><tbody>${(S.dataTables[f.key]?.rows||[]).slice(0,100).map(r=>`<tr>${r.map(c=>`<td>${_esc(c??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>${(S.dataTables[f.key]?.rows||[]).length>100?`<p style="color:#888;font-size:11px;margin-top:4px;">显示前100行，共${S.dataTables[f.key].rows.length}行</p>`:''}</div><div style="margin-top:6px;display:flex;gap:6px;"><button class="btn btn-sm btn-outline" onclick="navigator.clipboard.writeText('[TABLE:${f.key}]');toast('已复制 [TABLE:${f.key}]','info')">📋 复制引用标记</button><button class="btn btn-sm btn-danger" onclick="if(confirm('确定删除?')){removeFile(${i})}">🗑️ 删除</button></div></div>`).join('');
}

function renderFormulas(el){
  el.innerHTML=`<h2>📐 公式管理</h2>
  <div class="card"><h3>➕ 手动添加</h3><div class="fr"><div class="fg"><label>LaTeX 公式</label><input id="flatex" placeholder="E=mc^2 或 \\frac{a}{b}"></div><div class="fg"><label>描述</label><input id="fdesc" placeholder="可选"></div></div><div class="fg"><label>所属章节</label><select id="fsec">${S.outline.map(s=>`<option>${_esc(s.title)}</option>`).join('')||'<option>全文</option>'}</select></div><div style="margin-top:6px;display:flex;gap:6px;"><button class="btn btn-outline btn-sm" onclick="previewF()">🔍 预览</button><button class="btn btn-primary btn-sm" onclick="saveF()">💾 保存</button></div><div id="fprev" style="margin-top:8px;text-align:center;padding:16px;background:#f9f9f9;border-radius:6px;min-height:30px;"></div></div>

  ${S.formulas.length>0?`<div class="card"><h3>已保存公式 (${S.formulas.length}个)</h3>${S.formulas.map((f,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;"><span><b>[FORMULA:${i+1}]</b> ${_esc(f.latex)} <span style="color:#888;">${_esc(f.desc||'')}</span> <span id="fm-render-${i}"></span></span><button class="btn btn-danger btn-sm" onclick="S.formulas.splice(${i},1);save();renderPage('formulas')">删除</button></div>`).join('')}</div>`:''}`;
  setTimeout(()=>{S.formulas.forEach((f,i)=>{let e=_id('fm-render-'+i);if(e)try{katex.render(f.latex,e,{throwOnError:false})}catch(ex){}})},200);
}
function previewF(){let l=_id('flatex').value;if(!l)return;try{katex.render(l,_id('fprev'),{throwOnError:false,displayMode:true})}catch(e){_id('fprev').innerHTML=`<span style="color:red;">${e.message}</span>`}}
function saveF(){let l=_id('flatex').value;if(!l)return;S.formulas.push({latex:l,desc:_id('fdesc').value,section:_id('fsec').value,order:S.formulas.length+1});save();toast(`✅ [FORMULA:${S.formulas.length}]`,'success');renderPage('formulas')}
function autoDetectFormulas(){
  let allText=S.outline.filter(s=>s.content).map(s=>s.content).join(' ')+' '+S.userData;if(!allText.trim()){toast('没有已撰写的内容或数据描述','error');return}
  let found=[];
  for(let f of COMMON_FORMULAS){f.pattern.lastIndex=0;let matches=allText.match(f.pattern);if(matches&&matches.length>0){found.push({latex:f.latex,name:f.name,count:matches.length,examples:matches.slice(0,3)})}}
  // P值
  let pMatch=allText.match(/[pP]\s*[<>=]\s*0\.\d+/g);if(pMatch){let pv=[...new Set(pMatch)];pv.forEach(m=>found.push({latex:m.replace(/\s/g,''),name:'P值',count:1}))}
  // ± 模式
  let pmMatch=allText.match(/\d+\.?\d*\s*±\s*\d+\.?\d*/g);if(pmMatch){pmMatch.forEach(m=>found.push({latex:m,name:'均值±标准差',count:1}))}
  // 分数
  let fracMatch=allText.match(/\d+\/\d+/g);if(fracMatch){fracMatch.forEach(m=>{let[n,d]=m.split('/');found.push({latex:`\\frac{${n}}{${d}}`,name:'分数',count:1})})}
  // 百分比
  let pctMatch=allText.match(/\d+\.?\d*%/g);if(pctMatch){pctMatch.forEach(m=>{if(!found.some(f=>f.latex===m))found.push({latex:m,name:'百分比',count:1})})}
  // R²
  if(allText.match(/R\s*[²2]/gi))found.push({latex:'R^2=1-\\frac{SS_{res}}{SS_{tot}}',name:'R²决定系数',count:1});

  let seen=new Set(),uniq=[];for(let f of found){let k=f.latex;if(!seen.has(k)){seen.add(k);uniq.push(f)}}
  if(uniq.length===0){_id('auto-fm').innerHTML='<p style="color:#888;">未检测到数学表达式。在写作中加入"均值""方差""回归"等术语会触发识别。</p>';return}
  _id('auto-fm').innerHTML=`<p>检测到 <b>${uniq.length}</b> 个公式:</p>${uniq.map((f,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:4px 0;flex-wrap:wrap;"><span style="min-width:100px;color:#888;font-size:12px;">${f.name}${f.count>1?' (×'+f.count+')':''}</span><span id="ad-fm-${i}" style="background:#fff3cd;padding:4px 8px;border-radius:4px;font-size:13px;"></span><button class="btn btn-sm btn-primary" onclick="addDetectedFormula('${f.latex.replace(/'/g,"\\'")}','${f.name}')">+ 添加</button>${f.examples?`<span style="font-size:11px;color:#999;">如: ${f.examples.join(', ')}</span>`:''}</div>`).join('')}`;
  setTimeout(()=>{uniq.forEach((f,i)=>{let e=_id('ad-fm-'+i);if(e)try{katex.render(f.latex,e,{throwOnError:false})}catch(ex){}})},300);
}
function addDetectedFormula(latex,name){if(S.formulas.some(f=>f.latex===latex)){toast('已存在','info');return}S.formulas.push({latex,desc:name,section:'全文',order:S.formulas.length+1});save();toast(`✅ 已添加 ${name}`,'success');renderPage('formulas')}

let _dr=false;
async function runDeAI(){if(_dr)return;_dr=true;let secs=S.outline.filter(s=>s.content&&s.content.trim());if(!secs.length){toast('无已撰写章节','error');_dr=false;return}let cfg=S.deaiCfg,enabled=Object.entries(cfg).filter(([,v])=>v);if(!enabled.length){_dr=false;return}let styles={pass1:{n:'学术结构化',d:'使用正式学术语言，消除聊天机器人感。'},pass2:{n:'自然变化',d:'混合长短句，段落长度变化，打破均匀节奏。'},pass3:{n:'个人视角',d:'适当使用第一人称。'},pass4:{n:'具体化',d:'替换模糊表述为具体数据。'},pass5:{n:'人类节奏',d:'加入修辞问句和自然冗余。'}};let out=_id('daout');out.innerHTML='';for(let s of secs){out.innerHTML+=`<p><b>${_esc(s.title)}</b>...</p>`;let txt=s.content;for(let[k,_]of enabled){let st=styles[k];out.innerHTML+=`<p style="color:#888;font-size:12px;">→ ${st.n}...</p>`;try{let full='';for await(let c of dsStream(`改写: ${st.d}\n保留标记。`,txt.slice(0,6000))){full+=c}if(full.trim())txt=full}catch(e){out.innerHTML+=`<p style="color:red;">${e.message}</p>`}}s.content=txt;s.word_count=txt.length;s.deai_passes=(s.deai_passes||0)+enabled.length;out.innerHTML+=`<p style="color:green;">✅ 完成</p>`}save();out.innerHTML+='<p style="color:green;font-weight:bold;">🎉 全部完成</p>';_dr=false}
function renderDeai(el){let secs=S.outline.filter(s=>s.content&&s.content.trim());if(!secs.length){el.innerHTML='<div class="card"><p>无已撰写章节</p></div>';return}let cfg=S.deaiCfg,nn={pass1:'学术结构化',pass2:'自然变化',pass3:'个人视角',pass4:'具体化',pass5:'人类节奏'};el.innerHTML=`<h2>🔄 去AI化</h2><div class="card">${Object.entries(nn).map(([k,n],i)=>`<label style="display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;"><input type="checkbox" ${cfg[k]?'checked':''} onchange="S.deaiCfg['${k}']=this.checked;save()"> 第${i+1}轮: <b>${n}</b></label>`).join('')}<button class="btn btn-primary" style="margin-top:10px;" onclick="runDeAI()" ${_dr||!S.networkOk?'disabled':''}>🚀 开始 (${secs.length}章节)</button><div id="daout" style="margin-top:10px;font-size:13px;"></div></div>`}

function parseDocx(input){
  if(!input.files||!input.files[0])return;
  let reader=new FileReader();
  reader.onload=function(e){
    mammoth.extractRawText({arrayBuffer:e.target.result}).then(function(r){
      _id('revise-docx-preview').innerHTML=`<p style="color:green;">✅ 已解析: ${input.files[0].name} (约${r.value.length}字)</p><details><summary>预览前500字</summary><div style="max-height:200px;overflow:auto;background:#fafafa;padding:10px;border-radius:6px;white-space:pre-wrap;">${r.value.slice(0,500)}</div></details>`;
      _id('revise-text').value=r.value;
    }).catch(function(e){toast('Word解析失败: '+e.message,'error')});
  };
  reader.readAsArrayBuffer(input.files[0]);
}
async function runRevise(){
  let text=_id('revise-text').value.trim();if(!text){toast('请粘贴论文内容或上传Word文件','error');return}
  let tpl=_id('revise-template').value,mode=_id('revise-mode').value,out=_id('revise-result');
  out.innerHTML='<div class="writing-content">⏳ AI处理中...</div>';
  let prompts={
    '根据模板重构格式和结构':`你是学术论文编辑。请根据「${THESIS_TYPES[tpl].name}」的标准格式，对以下论文进行重构。保持原文核心观点和数据，调整章节结构、标题层级、参考文献格式，使其符合标准。`,
    '仅优化语言和学术表达':`你是学术论文润色专家。请优化以下论文的语言表达，使其更学术化、专业。保持原文结构不变，仅改善语言质量。`,
    '扩展内容并补充章节':`你是学术论文写作专家。请扩展以下论文，补充缺失的标准章节（如摘要、文献综述、结论等），丰富论证内容。目标字数约${THESIS_TYPES[tpl].words}字。`,
    '一键降重改写':`你是论文降重专家。请对以下论文进行深度改写以降低查重率。变化句式结构、同义词替换、调整段落顺序，但保持学术准确性和核心信息不变。使其查重率大幅降低。`,
    'AI综合评分+修改建议':`你是学术论文评审专家。请对以下论文进行综合评分（满分100分），从学术规范、逻辑结构、语言表达、创新性、数据支撑五个维度打分，并给出具体修改建议。然后给出优化后的版本。`
  };
  try{
    let full='';
    for await(let c of dsStream(prompts[mode],text.slice(0,12000))){
      full+=c;out.innerHTML=`<div class="writing-content">${full}</div>`;
    }
    toast('✅ 修改完成！','success');
  }catch(e){out.innerHTML=`<p style="color:red;">失败: ${e.message}</p>`}
}
// ==================== 导出（含数据表格、图片、图表） ====================
async function doExport(){
  let secs=S.outline.filter(s=>s.content&&s.content.trim());if(!secs.length){toast('无已完成的章节','error');return}
  let m=S.metadata,h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>body{font-family:SimSun,serif;font-size:12pt;line-height:1.5}h1{font-family:SimHei,sans-serif;font-size:22pt;text-align:center}h2{font-family:SimHei,sans-serif;font-size:16pt}h3{font-family:SimHei,sans-serif;font-size:14pt}p{text-indent:2em;margin:6pt 0}table{border-collapse:collapse;margin:8pt auto}td,th{border:1px solid #000;padding:4pt 8pt}img{max-width:480px}@page{size:A4;margin:2.54cm 3.17cm}</style></head><body>`;
  h+=`<br><br><br><br><h1>${m.title}</h1><br><p style="text-align:center">作者：${m.author}</p><p style="text-align:center">指导教师：${m.advisor}</p><p style="text-align:center">${m.university} | ${m.department}</p><p style="text-align:center">${new Date().toISOString().slice(0,7)}</p><br style="page-break-after:always">`;
  h+=`<h2>摘要</h2><p>（请在Word中补充摘要）</p><br style="page-break-after:always">`;
  for(let s of secs){h+=`<h2>${s.title}</h2>`;let paras=s.content.split('\n').filter(p=>p.trim());
    for(let p of paras){
      let tm=p.match(/\[TABLE:([^\]]+)\]/),cm=p.match(/\[CHART:([^\]]+)\]/),im=p.match(/\[IMAGE:([^\]]+)\]/);
      if(tm&&S.dataTables[tm[1]]){
        h+=`<p>${p.replace(/\[TABLE:[^\]]+\]/,'')}</p>`;
        let dt=S.dataTables[tm[1]];h+=`<table><tr>${dt.headers.filter(x=>x).map(h=>`<th>${h}</th>`).join('')}</tr>${dt.rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</table><p style="font-size:10pt;text-align:center;">表: ${tm[1]}</p>`;
      }else if(cm&&S.dataCharts[cm[1]]){
        h+=`<p>${p.replace(/\[CHART:[^\]]+\]/,'')}</p><p style="text-align:center"><img src="${S.dataCharts[cm[1]].image}"></p><p style="font-size:10pt;text-align:center;">图: ${cm[1]}</p>`;
      }else if(im){
        let img=S.uploadedImages.find(x=>x.name===im[1]);
        if(img){h+=`<p>${p.replace(/\[IMAGE:[^\]]+\]/,'')}</p><p style="text-align:center"><img src="${img.data}"></p><p style="font-size:10pt;text-align:center;">图: ${im[1]}</p>`}else h+=`<p>${p}</p>`;
      }else h+=`<p>${p}</p>`;
    }
    if(s!==secs[secs.length-1])h+=`<br style="page-break-after:always">`;
  }
  if(S.references.length>0){h+=`<br style="page-break-after:always"><h2>参考文献</h2>`;S.references.forEach((r,i)=>h+=`<p style="text-indent:0;font-size:10.5pt">[${i+1}] ${r.text}</p>`)}
  h+=`<br style="page-break-after:always"><h2>致谢</h2><p>本论文的完成离不开导师的悉心指导和同学们的热情帮助，在此表示衷心的感谢。</p></body></html>`;
  let b=new Blob([h],{type:'application/msword'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(m.title||'论文')+'.doc';a.click();URL.revokeObjectURL(u);toast('✅ 已导出，表格/图表/图片已嵌入','success')
}
function renderExport(el){let secs=S.outline,w=secs.filter(s=>s.content&&s.content.trim()),tw=w.reduce((s,i)=>s+(i.word_count||0),0);el.innerHTML=`<h2>📥 导出论文</h2><div class="card"><div class="stats"><div class="stat"><div class="v">${w.length}/${secs.length}</div><div class="l">章节</div></div><div class="stat"><div class="v">${tw.toLocaleString()}</div><div class="l">字数</div></div><div class="stat"><div class="v">${S.formulas.length}</div><div class="l">公式</div></div><div class="stat"><div class="v">${Object.keys(S.dataTables).length+S.uploadedImages.length}</div><div class="l">数据/图片</div></div></div></div><div class="card"><h3>各章节</h3>${secs.map(s=>`<p>${s.content?'✅':''} ${_esc(s.title)} — ${(s.word_count||0).toLocaleString()}字 ${s.deai_passes?`| 去AI:${s.deai_passes}轮`:''}</p>`).join('')}</div>${w.length>0?`<div class="card"><button class="btn btn-primary" onclick="doExport()" style="font-size:15px;padding:10px 28px;">🎓 生成Word (.doc)</button><p style="color:#888;font-size:11px;margin-top:6px;">表格、图表、上传的图片自动嵌入论文相应位置</p></div>`:'<div class="card"><p>无已完成的章节</p></div>'}`}

// ==================== 启动 ====================
checkNet();renderSidebar();navigate(S.page||'home');
</script>
